<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logopag.png" type="image/x-icon">
    <title>Trivia del Socio</title>
    <style>
        /* === ESTILOS GLOBALES === */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Sistema de Vistas (Pantallas) */
        .screen {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            transition: background 0.5s ease;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.95);
        }

        .screen.active {
            display: flex;
        }

        /* === BARRA SUPERIOR (HEADER) === */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .menu-toggle {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 16px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .menu-toggle span {
            display: block;
            height: 2.5px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 5px;
            pointer-events: none;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .logo-decoration {
            width: 50px;
            height: 50px;
            border: 2px dashed #ffffff;
            border-radius: 50%;
            margin: 0 0 0 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            text-align: center;
            box-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            cursor: default;
        }

        .timer-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 4px #000;
            display: none;
        }

        /* === FONDOS PERSONALIZADOS POR EQUIPO === */
        .bg-river { background: linear-gradient(135deg, #000000 45%, #cc0000 45%, #cc0000 55%, #000000 55%); }
        .bg-boca { background: linear-gradient(to bottom, #001a4d 35%, #a68a00 35%, #a68a00 55%, #001a4d 55%); }
        .bg-independiente {
            background-color: #660000;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M30 10 h40 v8 h-40 z M35 18 h30 v30 c0 20 -15 25 -15 25 s -15 -5 -15 -25 z M25 18 c -12 0 -12 22 0 22 M75 18 c 12 0 12 22 0 22 M20 85 l 10 -15 h 40 l 10 15 v 5 h-60 z" fill="rgba(0,0,0,0.15)" stroke="none"/></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 60vh;
        }
        .bg-racing { background-color: #00132b; }
        .bg-racing::before, .bg-racing::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 14px;
            background: repeating-linear-gradient(to right, #66b3ff, #66b3ff 2px, transparent 2px, transparent 6px);
            opacity: 0.5;
            pointer-events: none;
            z-index: 1;
        }
        .bg-racing::before { left: 20px; }
        .bg-racing::after { right: 20px; }

        .bg-sanlorenzo { background: repeating-linear-gradient(90deg, #001333, #001333 60px, #4d0000 60px, #4d0000 120px); }

        .bg-huracan { background-color: #ffffff; }
        .bg-huracan::before, .bg-huracan::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 8px;
            background-color: #a81c1c; 
            z-index: 1;
        }
        .bg-huracan::before { left: 10px; }
        .bg-huracan::after { right: 10px; }
        .bg-huracan .question { color: #ffffff; text-shadow: 2px 2px 8px #000000, -1px -1px 4px #000000; }
        .bg-huracan .option-btn { background-color: rgba(0, 0, 0, 0.85); color: #ffffff; }

        .chicana-dark-mode::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 5;
            pointer-events: none;
        }

        /* === MENÚ LATERAL (ASIDE) === */
        aside.sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 270px;
            height: 100vh;
            background-color: #0a0a0a;
            border-right: 2px solid #001f4d;
            transition: left 0.3s ease-in-out;
            z-index: 200;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        aside.sidebar.open { left: 0; }

        .close-btn {
            background: none;
            border: none;
            color: #aaaaaa;
            font-size: 2.5rem;
            cursor: pointer;
            align-self: flex-end;
            margin-bottom: 20px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar-nav button {
            background: transparent;
            border: 2px solid #333;
            color: #fff;
            padding: 15px 25px;
            font-size: 1.2rem;
            cursor: pointer;
            text-align: center;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .sidebar-nav button:hover {
            background: #1a1a1a;
        }

        .sidebar-nav button.active-nav {
            background-color: #1a1a1a;
            border-color: #ffffff;
            transform: scale(1.05);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* === PANTALLA DE LOGIN INICIAL === */
        #login-screen {
            background-color: #000000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 300;
        }

        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #333;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        .login-box h2 {
            margin: 0;
            font-size: 1.8rem;
            text-align: center;
            text-shadow: 2px 2px 4px #000;
        }

        .login-input {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffffff;
            border-radius: 50px;
            color: #ffffff;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }

        .login-input::placeholder { color: #888; }

        /* === PANTALLA: MENÚ PRINCIPAL === */
        #menu-screen {
            background-color: #000000;
            justify-content: center;
            align-items: center;
            box-shadow: none; 
        }

        .user-greeting {
            font-size: 1.4rem;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 2px 2px 4px #000;
            color: #f5f2eb; /* Blanco hueso / amarillento */
        }

        .carousel-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-bottom: 50px;
            position: relative;
        }

        .carousel-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 3.5rem;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 0 40px;
            z-index: 10;
        }
        
        .carousel-btn:hover { transform: scale(1.2); }

        .carousel-track {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            position: relative;
            height: 100px;
            overflow: hidden;
        }

        .team-center {
            font-size: 2.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 5px #000;
            white-space: nowrap;
            z-index: 5;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .team-side {
            position: absolute;
            font-size: 1.4rem;
            color: #777;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0.6;
            transition: all 0.4s ease;
        }

        .left-side {
            left: -10px;
            -webkit-mask-image: linear-gradient(to right, transparent 10%, black 100%);
            mask-image: linear-gradient(to right, transparent 10%, black 100%);
        }

        .right-side {
            right: -10px;
            -webkit-mask-image: linear-gradient(to left, transparent 10%, black 100%);
            mask-image: linear-gradient(to left, transparent 10%, black 100%);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-anim { animation: popIn 0.4s forwards; }

        /* === PANTALLAS: VITRINA Y POSICIONES === */
        #vitrina-screen, #leaderboard-screen {
            background-color: #4a0000; 
            padding: 100px 40px 40px 40px;
            overflow-y: auto;
        }

        .screen-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px #000;
        }

        .vitrina-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .socio-card {
            width: 150px;
            height: 90px;
            border: 3px solid #ffffff;
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.5);
            transition: all 0.5s ease;
            opacity: 0.2; 
            filter: grayscale(100%);
        }

        .socio-card.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .card-photo { width: 35px; height: 45px; background-color: #ffffff; border-radius: 4px; }
        .card-lines { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
        .card-line { height: 4px; background-color: #ffffff; border-radius: 2px; }
        .card-line.short { width: 60%; }
        .card-desc { font-size: 0.9rem; text-align: center; color: #cccccc; text-shadow: 1px 1px 2px #000; }

        .leaderboard-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        .podium-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .podium-card {
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            width: 160px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .podium-card.p1 { border-color: #ffd700; background: rgba(50, 40, 0, 0.85); }
        .podium-card.p2 { border-color: #c0c0c0; box-shadow: 0 0 15px rgba(192, 192, 192, 0.4); }
        .podium-card.p3 { border-color: #cd7f32; box-shadow: 0 0 15px rgba(205, 127, 50, 0.4); }

        .podium-place { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .podium-name { font-size: 1rem; margin-bottom: 3px; font-weight: bold; }
        .podium-details { font-size: 0.85rem; color: #ccc; }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0,0,0,0.6);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #666;
        }

        .leaderboard-table th { background-color: #000; color: #fff; text-transform: uppercase; font-size: 1.1rem; }
        .leaderboard-table tr:last-child td { border-bottom: none; }
        .leaderboard-table tr:hover { background-color: rgba(255,255,255,0.1); }

        /* === PANTALLA: JUEGO === */
        #game-screen {
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        #game-screen section { z-index: 10; width: 100%; }

        .question {
            font-size: 1.8rem;
            margin: 0 auto 30px auto;
            max-width: 800px;
            min-height: 60px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); 
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0;
        }

        .option-btn {
            background-color: rgba(0, 0, 0, 0.7); 
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 100px; 
            padding: 15px 30px; 
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            width: 100%;
            text-shadow: 1px 1px 2px #000;
        }

        .option-btn:hover:not(:disabled) { background-color: rgba(255, 255, 255, 0.2); }
        .option-btn:active:not(:disabled) { transform: scale(0.98); }

        .action-btn {
            background-color: #ffffff;
            color: #000000;
            border: 3px solid #000000;
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px auto 0;
            display: none; 
            width: 100%;
            max-width: 300px;
        }

        .action-btn:hover { background-color: #cccccc; }

        .btn-inverted {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            font-size: 1rem;
            padding: 10px 25px;
        }

        .btn-inverted:hover { background-color: #333333; }

        /* === PIE DE PÁGINA (FOOTER) === */
        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 100;
        }

        .author-info { color: rgba(150, 150, 150, 0.5); font-size: 0.85rem; margin: 0; }

        .ad-block {
            position: absolute;
            bottom: 20px; 
            left: 50%;
            transform: translateX(-50%); 
            width: 320px;
            height: 40px;
            background-color: rgba(10, 10, 10, 0.9);
            border: 1px solid #1a1a1a;
            color: #666666;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            pointer-events: auto;
        }

        .status-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            transition: opacity 0.3s;
            text-shadow: 2px 2px 4px #000;
        }

        .level-title { font-size: 0.9rem; color: #cccccc; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; }
        .counter { font-size: 2rem; font-weight: bold; color: #ffffff; }

        /* === RESPONSIVE (CELULARES) === */
        @media (max-width: 768px) {
            header { padding: 15px; }
            .timer-display { font-size: 1.2rem; }
            
            .carousel-btn { font-size: 2.5rem; padding: 0 15px; }
            .team-center { font-size: 1.8rem; }
            .team-side { font-size: 1rem; }
            .left-side { left: 0px; }
            .right-side { right: 0px; }
            
            .vitrina-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .screen-title { font-size: 1.8rem; margin-bottom: 25px; }
            
            #vitrina-screen, #leaderboard-screen { padding: 80px 20px 20px 20px; }
            
            .leaderboard-table th, .leaderboard-table td { padding: 10px 5px; font-size: 0.9rem; }
            
            .question { font-size: 1.3rem; margin-bottom: 20px; }
            .option-btn { font-size: 1rem; padding: 12px 20px; }
            .action-btn { font-size: 1rem; padding: 12px 20px; }
            
            footer { padding: 0 15px; height: 60px; }
            .ad-block { width: 150px; font-size: 0.6rem; bottom: 10px; }
            .author-info { font-size: 0.7rem; }
            .counter { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle-btn" onclick="toggleSidebar()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <figure class="logo-decoration" style="padding: 0; overflow: hidden; border: 2px solid #ffffff;">
                <img src="logopag.png" alt="Logo" style="width: 100%; height: 100%; object-fit: cover;">
            </figure>
        </div>
        <div class="timer-display" id="main-timer">00:00</div>
    </header>

    <aside class="sidebar" id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        <nav class="sidebar-nav">
            <button id="nav-inicio" class="active-nav" onclick="switchScreen('menu-screen', this); toggleSidebar();">Inicio</button>
            <button id="nav-vitrina" onclick="switchScreen('vitrina-screen', this); toggleSidebar();">Vitrina</button>
            <button id="nav-posiciones" onclick="switchScreen('leaderboard-screen', this); toggleSidebar(); renderLeaderboard();">Posiciones</button>
        </nav>
    </aside>

    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h2>Identifíquese, socio.</h2>
            <input type="text" id="username-input" class="login-input" placeholder="Tu nombre de usuario" maxlength="15">
            <button class="action-btn" style="display: block; position: relative;" onclick="handleLogin()">Ingresar</button>
        </div>
    </div>

    <main id="menu-screen" class="screen">
        <div id="user-greeting" class="user-greeting">¿Qué club te gusta, socio?</div>
        <div class="carousel-wrapper">
            <button class="carousel-btn" onclick="prevClub()">&#10094;</button>
            <div class="carousel-track">
                <div class="team-side left-side" id="prev-team">Huracán</div>
                <div class="team-center pop-anim" id="team-name">River Plate</div>
                <div class="team-side right-side" id="next-team">Boca Juniors</div>
            </div>
            <button class="carousel-btn" onclick="nextClub()">&#10095;</button>
        </div>
        <button class="action-btn" style="display: block; position: relative; z-index: 10;" onclick="startGame()">¡Quiero ser socio!</button>
    </main>

    <main id="vitrina-screen" class="screen">
        <h1 class="screen-title">Tu Vitrina de Socios</h1>
        <div class="vitrina-grid" id="vitrina-grid"></div>
    </main>

    <main id="leaderboard-screen" class="screen">
        <h1 class="screen-title">Tabla de Posiciones</h1>
        <div class="leaderboard-container">
            <div class="podium-box" id="podium-container"></div>
            <table class="leaderboard-table" id="leaderboard-table-wrap">
                <thead>
                    <tr>
                        <th>N°</th>
                        <th>Nombre</th>
                        <th>Club</th>
                        <th>Tiempo</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </main>

    <main id="game-screen" class="screen">
        <section aria-labelledby="question-text">
            <p class="question" id="question-text">Cargando pregunta...</p>
            
            <div class="options-list" id="options-container">
                <button class="option-btn" onclick="checkAnswer(0)" id="btn-0">Opción 1</button>
                <button class="option-btn" onclick="checkAnswer(1)" id="btn-1">Opción 2</button>
                <button class="option-btn" onclick="checkAnswer(2)" id="btn-2">Opción 3</button>
                <button class="option-btn" onclick="checkAnswer(3)" id="btn-3">Opción 4</button>
            </div>

            <button id="final-action-btn" class="action-btn"></button>
            <button id="fe-hincha-btn" class="action-btn" style="background-color: #ffd700; color: #000; border-color: #ccaa00;" onclick="restartFromCurrentLevel()">La fe del hincha...</button>
            <button id="back-menu-btn" class="action-btn btn-inverted" onclick="switchScreen('menu-screen', document.getElementById('nav-inicio'))">Volver al menú</button>
        </section>
    </main>

    <footer>
        <p class="author-info">Creado por: Yair Carrizo</p>
        <div class="ad-block">Espacio Publicitario</div>
        <div class="status-container" id="status-container" style="opacity: 0;">
            <span class="level-title" id="level-title">Nivel: Fácil</span>
            <div class="counter" id="counter-text">0/5</div>
        </div>
    </footer>

    <script>
        // === GESTIÓN DE USUARIO Y CLUBES ===
        let currentPlayer = localStorage.getItem('vf_player') || "Socio Anónimo";
        const clubs = ["River Plate", "Boca Juniors", "Independiente", "Racing", "San Lorenzo", "Huracán"];
        let currentClubIndex = 0;
        
        let unlockedClubs = JSON.parse(localStorage.getItem('vf_unlocked')) || {
            "River Plate": false, "Boca Juniors": false, "Independiente": false,
            "Racing": false, "San Lorenzo": false, "Huracán": false
        };

        let leaderboardData = JSON.parse(localStorage.getItem('vf_leaderboard')) || [];
        let gameTimer = 0;
        let timerInterval;
        let feHinchaUsed = false;

        // Auto-completar si ya hay usuario guardado en navegador
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('vf_player')) {
                document.getElementById('username-input').value = currentPlayer;
                document.getElementById('user-greeting').innerText = `¿Qué club te gusta, ${currentPlayer}?`;
            }
        });

        function handleLogin() {
            const inputVal = document.getElementById('username-input').value.trim();
            if(inputVal !== "") {
                currentPlayer = inputVal;
                localStorage.setItem('vf_player', currentPlayer);
            }
            document.getElementById('user-greeting').innerText = `¿Qué club te gusta, ${currentPlayer}?`;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function renderVitrina() {
            const grid = document.getElementById('vitrina-grid');
            grid.innerHTML = '';
            clubs.forEach(club => {
                const isUnlocked = unlockedClubs[club];
                grid.innerHTML += `
                    <div class="card-wrapper">
                        <div class="socio-card ${isUnlocked ? 'unlocked' : ''}">
                            <div class="card-photo"></div>
                            <div class="card-lines">
                                <div class="card-line"></div>
                                <div class="card-line"></div>
                                <div class="card-line short"></div>
                            </div>
                        </div>
                        <p class="card-desc">Socio de ${club}</p>
                    </div>
                `;
            });
        }
        renderVitrina();

        function renderLeaderboard() {
            const podiumBox = document.getElementById('podium-container');
            const tbody = document.getElementById('leaderboard-body');
            const tableWrap = document.getElementById('leaderboard-table-wrap');
            
            podiumBox.innerHTML = '';
            tbody.innerHTML = '';

            const sortedData = [...leaderboardData].sort((a, b) => a.time - b.time);

            // Renderizar el podio de los 3 primeros
            const top3 = sortedData.slice(0, 3);
            const medals = ["🥇 1° Puesto", "🥈 2° Puesto", "🥉 3° Puesto"];
            const podiumClasses = ["p1", "p2", "p3"];

            top3.forEach((entry, idx) => {
                podiumBox.innerHTML += `
                    <div class="podium-card ${podiumClasses[idx]}">
                        <div class="podium-place">${medals[idx]}</div>
                        <div class="podium-name">${entry.name}</div>
                        <div class="podium-details">${entry.club}</div>
                        <div class="podium-details" style="font-weight:bold; margin-top:4px;">${formatTime(entry.time)}</div>
                    </div>
                `;
            });

            // Renderizar el resto de la tabla a partir del 4to puesto
            const restOfPlayers = sortedData.slice(3);
            if (restOfPlayers.length > 0) {
                tableWrap.style.display = 'table';
                restOfPlayers.forEach((entry, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 4}</td>
                            <td>${entry.name}</td>
                            <td>${entry.club}</td>
                            <td>${formatTime(entry.time)}</td>
                        </tr>
                    `;
                });
            } else {
                tableWrap.style.display = 'none';
            }
        }

        function switchScreen(screenId, btnElement) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if(btnElement) {
                document.querySelectorAll('.sidebar-nav button').forEach(b => b.classList.remove('active-nav'));
                btnElement.classList.add('active-nav');
            }

            document.getElementById('status-container').style.opacity = (screenId === 'game-screen') ? '1' : '0';
            document.getElementById('main-timer').style.display = (screenId === 'game-screen') ? 'block' : 'none';
            
            if(screenId !== 'game-screen') clearInterval(timerInterval);
        }

        function updateCarousel() {
            const prevIndex = (currentClubIndex - 1 + clubs.length) % clubs.length;
            const nextIndex = (currentClubIndex + 1) % clubs.length;
            document.getElementById('prev-team').innerText = clubs[prevIndex];
            document.getElementById('next-team').innerText = clubs[nextIndex];
            
            const centerTeam = document.getElementById('team-name');
            centerTeam.innerText = clubs[currentClubIndex];
            
            centerTeam.classList.remove('pop-anim');
            void centerTeam.offsetWidth; 
            centerTeam.classList.add('pop-anim');
        }

        function nextClub() { currentClubIndex = (currentClubIndex + 1) % clubs.length; updateCarousel(); }
        function prevClub() { currentClubIndex = (currentClubIndex - 1 + clubs.length) % clubs.length; updateCarousel(); }

                socio: [ { q: "¿En qué año se fundó oficialmente el Club Atlético Huracán?", options: ["1 de enero de 1908", "1 de noviembre de 1908", "25 de mayo de 1905", "12 de octubre de 1908"], answer: 1 }, { q: "¿De quién tomó su nombre el club 'Huracán'?", options: ["Un viento fuerte de la zona", "El globo aerostático de Jorge Newbery", "Un barco", "Una tienda de Parque Patricios"], answer: 1 }, { q: "¿Qué cargo ocupó el histórico Tomás Adolfo Ducó además de jugador?", options: ["Sacerdote", "Presidente del Club y Militar", "Gobernador", "Médico"], answer: 1 }, { q: "¿Cuántos títulos de Primera División en la era Amateur posee Huracán?", options: ["2", "3", "4", "5"], answer: 2 }, { q: "¿Cuál fue el primer presidente de la historia del club?", options: ["José Wuille Bille", "Tomás Ducó", "Jorge Newbery", "Lorenzo Mazzucco"], answer: 0 } ]
            }
        };

        // === VARIABLES DEL JUEGO ===
        const levels = ["facil", "medio", "dificil", "socio"];
        let currentLevelIndex = 0;
        let correctAnswers = 0;
        const requiredToAdvance = 5;
        let availableQuestions = {};
        let currentQuestionObj = null;
        let currentOptionsMap = [];
        let isChicana = false; 
        let chicanaAprobada = false;

        function setClubBackground(club) {
            const gameScreen = document.getElementById('game-screen');
            gameScreen.className = 'screen active'; 
            
            if (club === "River Plate") gameScreen.classList.add('bg-river');
            else if (club === "Boca Juniors") gameScreen.classList.add('bg-boca');
            else if (club === "Independiente") gameScreen.classList.add('bg-independiente');
            else if (club === "Racing") gameScreen.classList.add('bg-racing');
            else if (club === "San Lorenzo") gameScreen.classList.add('bg-sanlorenzo');
            else if (club === "Huracán") gameScreen.classList.add('bg-huracan');
        }

        function startGame() {
            const selectedClub = clubs[currentClubIndex];
            const clubQuestions = database[selectedClub];

            availableQuestions = {
                facil: [...clubQuestions.facil],
                medio: [...clubQuestions.medio],
                dificil: [...clubQuestions.dificil],
                socio: [...clubQuestions.socio]
            };

            currentLevelIndex = 0;
            correctAnswers = 0;
            isChicana = false;
            chicanaAprobada = false;
            feHinchaUsed = false; 
            
            document.getElementById('final-action-btn').style.display = 'none';
            document.getElementById('fe-hincha-btn').style.display = 'none';
            document.getElementById('back-menu-btn').style.display = 'none';
            document.getElementById('options-container').style.display = 'flex';
            
            gameTimer = 0;
            clearInterval(timerInterval);
            document.getElementById('main-timer').innerText = "00:00";
            timerInterval = setInterval(() => {
                gameTimer++;
                document.getElementById('main-timer').innerText = formatTime(gameTimer);
            }, 1000);

            switchScreen('game-screen', document.getElementById('nav-inicio'));
            setClubBackground(selectedClub);
            loadNextQuestion();
        }

        function restartFromCurrentLevel() {
            feHinchaUsed = true; 
            const selectedClub = clubs[currentClubIndex];
            const currentDifficulty = levels[currentLevelIndex];
            
            availableQuestions[currentDifficulty] = [...database[selectedClub][currentDifficulty]];
            
            correctAnswers = 0;
            chicanaAprobada = false; 
            
            document.getElementById('final-action-btn').style.display = 'none';
            document.getElementById('fe-hincha-btn').style.display = 'none';
            document.getElementById('back-menu-btn').style.display = 'none';
            document.getElementById('options-container').style.display = 'flex';
            document.getElementById('status-container').style.opacity = '1';
            
            timerInterval = setInterval(() => {
                gameTimer++;
                document.getElementById('main-timer').innerText = formatTime(gameTimer);
            }, 1000);
            
            loadNextQuestion();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadNextQuestion() {
            const currentDifficulty = levels[currentLevelIndex];
            const selectedClub = clubs[currentClubIndex];
            const gameScreen = document.getElementById('game-screen');
            
            if (currentDifficulty === 'socio' && !chicanaAprobada) {
                isChicana = true;
                currentQuestionObj = chicanas[selectedClub];
                gameScreen.classList.add('chicana-dark-mode');
                document.getElementById('level-title').innerText = "CHICANA";
                document.getElementById('level-title').style.color = "#ff00ff";
            } else {
                isChicana = false;
                gameScreen.classList.remove('chicana-dark-mode');
                document.getElementById('level-title').style.color = "#cccccc";
                
                const pool = availableQuestions[currentDifficulty];
                const randomIndex = Math.floor(Math.random() * pool.length);
                currentQuestionObj = pool[randomIndex];
                pool.splice(randomIndex, 1);
                
                document.getElementById('level-title').innerText = `Nivel: ${currentDifficulty.toUpperCase()}`;
            }

            document.getElementById('question-text').innerText = currentQuestionObj.q;
            document.getElementById('counter-text').innerText = `${correctAnswers}/${requiredToAdvance}`;

            currentOptionsMap = currentQuestionObj.options.map((opt, originalIndex) => ({
                text: opt,
                isCorrect: originalIndex === currentQuestionObj.answer
            }));
            
            shuffleArray(currentOptionsMap);

            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`btn-${i}`);
                btn.innerText = currentOptionsMap[i].text;
                
                if (selectedClub === "Huracán" && !isChicana) {
                    btn.style.backgroundColor = "rgba(0,0,0,0.85)";
                } else {
                    btn.style.backgroundColor = "rgba(0,0,0,0.7)";
                }
                
                btn.style.borderColor = "#ffffff";
                btn.disabled = false;
            }
        }

        function checkAnswer(selectedIndex) {
            for (let i = 0; i < 4; i++) { document.getElementById(`btn-${i}`).disabled = true; }

            const btn = document.getElementById(`btn-${selectedIndex}`);
            const isCorrect = currentOptionsMap[selectedIndex].isCorrect;
            
            if (isCorrect) {
                btn.style.backgroundColor = "rgba(0, 128, 0, 0.9)"; 
                btn.style.borderColor = "#00ff00";

                if (isChicana) {
                    chicanaAprobada = true;
                    setTimeout(loadNextQuestion, 1200);
                    return;
                }

                correctAnswers++;
                document.getElementById('counter-text').innerText = `${correctAnswers}/${requiredToAdvance}`;

                if (correctAnswers >= requiredToAdvance) {
                    correctAnswers = 0;
                    currentLevelIndex++;
                    
                    setTimeout(() => {
                        if (currentLevelIndex < levels.length) {
                            const nextLevel = levels[currentLevelIndex];
                            const qText = document.getElementById('question-text');
                            
                            if (nextLevel === "medio") qText.innerHTML = '<span style="color: #90ee90;">Siguiente nivel: Medio</span>';
                            else if (nextLevel === "dificil") qText.innerHTML = '<span style="color: #ffa500;">Siguiente nivel: Difícil</span>';
                            else if (nextLevel === "socio") qText.innerHTML = '<span style="color: #ff0000;">Siguiente nivel: Socio (Chicana Inminente)</span>';
                            
                            document.getElementById('options-container').style.display = 'none';
                            
                            setTimeout(() => {
                                document.getElementById('options-container').style.display = 'flex';
                                loadNextQuestion();
                            }, 2000); 

                        } else {
                            showWinScreen();
                        }
                    }, 500);
                } else {
                    setTimeout(loadNextQuestion, 800);
                }
            } else {
                btn.style.backgroundColor = "rgba(204, 0, 0, 0.9)"; 
                btn.style.borderColor = "#ff0000";
                
                const correctIndex = currentOptionsMap.findIndex(opt => opt.isCorrect);
                const correctBtn = document.getElementById(`btn-${correctIndex}`);
                correctBtn.style.backgroundColor = "rgba(0, 128, 0, 0.9)";

                setTimeout(showLoseScreen, 1500);
            }
        }

        function showLoseScreen() {
            clearInterval(timerInterval);
            const clubName = clubs[currentClubIndex];
            document.getElementById('game-screen').classList.remove('chicana-dark-mode');
            
            if (feHinchaUsed) {
                document.getElementById('question-text').innerText = `Decepcionaste a los hinchas que confiaban en vos, ${currentPlayer}.`;
            } else {
                document.getElementById('question-text').innerText = `Usted no es un verdadero fanático de ${clubName}...`;
            }

            document.getElementById('options-container').style.display = 'none';
            document.getElementById('status-container').style.opacity = '0'; 
            
            const actionBtn = document.getElementById('final-action-btn');
            actionBtn.innerText = "Volver a jugar";
            actionBtn.onclick = startGame;
            actionBtn.style.display = 'block';

            const feBtn = document.getElementById('fe-hincha-btn');
            if (currentLevelIndex >= 2 && !feHinchaUsed) { 
                feBtn.style.display = 'block';
            } else {
                feBtn.style.display = 'none';
            }

            document.getElementById('back-menu-btn').style.display = 'block';
        }

        function showWinScreen() {
            clearInterval(timerInterval);
            const clubName = clubs[currentClubIndex];
            document.getElementById('game-screen').classList.remove('chicana-dark-mode');
            document.getElementById('question-text').innerText = `¡Usted es un socio de ${clubName} con todas las letras!\nTiempo: ${formatTime(gameTimer)}`;
            document.getElementById('options-container').style.display = 'none';
            document.getElementById('status-container').style.opacity = '0'; 
            
            leaderboardData.push({ name: currentPlayer, club: clubName, time: gameTimer });
            localStorage.setItem('vf_leaderboard', JSON.stringify(leaderboardData));

            const actionBtn = document.getElementById('final-action-btn');
            actionBtn.innerText = "Obtener reconocimiento";
            actionBtn.onclick = triggerCardAnimation; 
            actionBtn.style.display = 'block';
            
            document.getElementById('fe-hincha-btn').style.display = 'none';
            document.getElementById('back-menu-btn').style.display = 'block';
        }

        function triggerCardAnimation() {
            document.getElementById('final-action-btn').style.display = 'none';
            document.getElementById('back-menu-btn').style.display = 'none';
            document.getElementById('question-text').innerText = "Generando credencial...";

            const flyingCard = document.createElement('div');
            flyingCard.className = 'flying-card';
            
            flyingCard.innerHTML = `
                <div style="display:flex; gap:10px; padding:10px; height:100%; box-sizing:border-box;">
                    <div style="width:30px; background:#fff; border-radius:4px;"></div>
                    <div style="display:flex; flex-direction:column; gap:6px; flex-grow:1;">
                        <div style="height:4px; background:#fff;"></div>
                        <div style="height:4px; background:#fff;"></div>
                        <div style="height:4px; background:#fff; width:60%;"></div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(flyingCard);
            flyingCard.style.top = '50%';
            flyingCard.style.left = '50%';
            flyingCard.style.transform = 'translate(-50%, -50%)';
            flyingCard.style.position = 'absolute';
            flyingCard.style.width = '150px';
            flyingCard.style.height = '90px';
            flyingCard.style.border = '3px solid #fff';
            flyingCard.style.borderRadius = '8px';
            flyingCard.style.background = 'rgba(255,255,255,0.15)';
            flyingCard.style.transition = 'all 1.2s ease-in-out';
            flyingCard.style.zIndex = '500';

            void flyingCard.offsetWidth;

            const menuIcon = document.getElementById('menu-toggle-btn').getBoundingClientRect();
            
            setTimeout(() => {
                flyingCard.style.top = `${menuIcon.top}px`;
                flyingCard.style.left = `${menuIcon.left}px`;
                flyingCard.style.transform = 'translate(0, 0) scale(0.1)';
                flyingCard.style.opacity = '0';
            }, 100);

            setTimeout(() => {
                flyingCard.remove();
                unlockedClubs[clubs[currentClubIndex]] = true; 
                localStorage.setItem('vf_unlocked', JSON.stringify(unlockedClubs));
                renderVitrina(); 
                switchScreen('vitrina-screen', document.getElementById('nav-vitrina')); 
            }, 1300); 
        }
    </script>
</body>
