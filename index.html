    <title>Trivia del Socio</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // =========================================================================
        // CONFIGURACIÓN DE FIREBASE 
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB49tUhXD7xdu8Q-R6MenQmwjepWt8bWIA",
            authDomain: "triviadelsocio.firebaseapp.com",
            databaseURL: "https://triviadelsocio-default-rtdb.firebaseio.com",
            projectId: "triviadelsocio",
            storageBucket: "triviadelsocio.firebasestorage.app",
            messagingSenderId: "737491363427",
            appId: "1:737491363427:web:df4cfd5fa68b219458fa56",
            measurementId: "G-RT11LFP5LY"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.fbSaveScore = async function(name, club, time) {
            try {
                const scoresRef = ref(db, 'leaderboard');
                const newScoreRef = push(scoresRef);
                await set(newScoreRef, { name, club, time });
                window.loadLeaderboardFromFirebase();
            } catch (error) {
                console.error("Error al guardar en Firebase:", error);
            }
        };

        window.loadLeaderboardFromFirebase = async function() {
            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, 'leaderboard'));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    leaderboardData = Object.values(data);
                    renderLeaderboard();
                } else {
                    leaderboardData = [];
                    renderLeaderboard();
                }
            } catch (error) {
                console.error("Error al leer de Firebase:", error);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            window.loadLeaderboardFromFirebase();
        });
    </script>

    <style>
        /* === ESTILOS GLOBALES === */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            transition: background 0.5s ease;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.95);
        }

        .screen.active {
            display: flex;
        }

        /* === BARRA SUPERIOR (HEADER) === */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 100;
            background-color: #000000;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .menu-toggle {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 16px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .menu-toggle span {
            display: block;
            height: 2.5px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 5px;
            pointer-events: none;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* LOGO CENTRADO EN EL HEADER (Para pantallas Menú, Vitrina, Posiciones) */
        .header-logo {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 50px;
            display: none; /* Se maneja por JS */
            justify-content: center;
            align-items: center;
        }
        
        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* LOGO DEL LOGIN (Elevado y Rectangular) */
        .login-logo {
            width: 250px;
            height: 80px;
            margin-bottom: 40px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .timer-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 4px #000;
            display: none;
        }

        /* === FONDOS PERSONALIZADOS POR EQUIPO (Incluye Lanús y Banfield) === */
        .bg-river { background: linear-gradient(135deg, #000000 45%, #cc0000 45%, #cc0000 55%, #000000 55%); }
        .bg-boca { background: linear-gradient(to bottom, #001a4d 35%, #a68a00 35%, #a68a00 55%, #001a4d 55%); }

            background-color: #660000;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M30 10 h40 v8 h-40 z M35 18 h30 v30 c0 20 -15 25 -15 25 s -15 -5 -15 -25 z M25 18 c -12 0 -12 22 0 22 M75 18 c 12 0 12 22 0 22 M20 85 l 10 -15 h 40 l 10 15 v 5 h-60 z" fill="rgba(0,0,0,0.15)" stroke="none"/></svg>');

        .bg-racing::before, .bg-racing::after {
            content: '';
            position: absolute;

            width: 14px;
            background: repeating-linear-gradient(to right, #66b3ff, #66b3ff 2px, transparent 2px, transparent 6px);

            z-index: 1;

        .bg-huracan { background-color: #ffffff; }

            position: absolute;
            top: 0; bottom: 0;
            width: 8px;
            background-color: #a81c1c; 
            z-index: 1;
        }
        .bg-huracan::before { left: 10px; }
        .bg-huracan::after { right: 10px; }

        .bg-lanus { background-color: #800000; }

        .bg-estudiantes { background: linear-gradient(135deg, #ffffff 45%, #d2001c 45%, #d2001c 55%, #ffffff 55%); }

            top: 0; left: 0; right: 0; bottom: 0;

            z-index: 5;
            pointer-events: none;
        }

        /* === MENÚ LATERAL (ASIDE) === */
        aside.sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 270px;
            height: 100vh;

            text-align: center;
            border-radius: 50px;

            background: #1a1a1a;
        }

            padding-top: 20px;

            background: transparent;
            border: 2px solid #222;
            color: #666;

            border-radius: 50px;

            background-repeat: no-repeat;
            justify-content: center;
            align-items: center;
            box-shadow: none; 
        }

        .user-greeting {
            font-size: 1.4rem;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 2px 2px 4px #000;
            color: #f5f2eb;
        }

        .carousel-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-bottom: 50px;
            position: relative;
        }

        .carousel-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 3.5rem;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 0 40px;
            z-index: 10;
        }
        
        .carousel-btn:hover { transform: scale(1.2); }

        .carousel-track {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            position: relative;
            height: 100px;
            overflow: hidden;
        }

        .team-center {
            font-size: 2.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 5px #000;
            white-space: nowrap;
            z-index: 5;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .team-side {
            position: absolute;
            font-size: 1.4rem;
            color: #777;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0.6;
            transition: all 0.4s ease;
        }

        .left-side {
            left: -10px;
            -webkit-mask-image: linear-gradient(to right, transparent 10%, black 100%);
            mask-image: linear-gradient(to right, transparent 10%, black 100%);
        }

        .right-side {
            right: -10px;
            -webkit-mask-image: linear-gradient(to left, transparent 10%, black 100%);
            mask-image: linear-gradient(to left, transparent 10%, black 100%);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-anim { animation: popIn 0.4s forwards; }

        /* === PANTALLAS: VITRINA Y POSICIONES === */
        #vitrina-screen {
            background:
                radial-gradient(ellipse at top, rgba(255, 215, 0, 0.10), transparent 55%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 90px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 90px),
                #4a0000;
            padding: 100px 40px 130px 40px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #leaderboard-screen {
            background-color: #4a0000; 
            padding: 100px 40px 130px 40px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .screen-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px #000;
        }

        .vitrina-title {
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.55), 2px 2px 4px #000;
        }

        .vitrina-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .socio-card {
            width: 150px;
            height: 90px;
            border: 3px solid #ffffff;
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.5);
            transition: all 0.5s ease;
            opacity: 0.2; 
            filter: grayscale(100%);
            position: relative;
        }

        .socio-card.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            background: rgba(255, 215, 0, 0.12);
            border-color: #ffd700;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.5);
        }

        .socio-card.unlocked::after {
            content: '⭐';
            position: absolute;
            top: -12px;
            right: -10px;
            font-size: 1.1rem;
            filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.9));
        }

        .card-photo { width: 35px; height: 45px; background-color: #ffffff; border-radius: 4px; }
        .card-lines { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
        .card-line { height: 4px; background-color: #ffffff; border-radius: 2px; }
        .card-line.short { width: 60%; }
        .card-desc { font-size: 0.9rem; text-align: center; color: #cccccc; text-shadow: 1px 1px 2px #000; }

        .leaderboard-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        .podium-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .podium-card {
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            width: 160px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .podium-card.p1 { border-color: #ffd700; background: rgba(50, 40, 0, 0.85); }
        .podium-card.p2 { border-color: #c0c0c0; box-shadow: 0 0 15px rgba(192, 192, 192, 0.4); }
        .podium-card.p3 { border-color: #cd7f32; box-shadow: 0 0 15px rgba(205, 127, 50, 0.4); }

        .podium-place { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .podium-name { font-size: 1rem; margin-bottom: 3px; font-weight: bold; }
        .podium-details { font-size: 0.85rem; color: #ccc; }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0,0,0,0.6);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #666;
        }

        .leaderboard-table th { background-color: #000; color: #fff; text-transform: uppercase; font-size: 1.1rem; }
        .leaderboard-table tr:last-child td { border-bottom: none; }
        .leaderboard-table tr:hover { background-color: rgba(255,255,255,0.1); }

        /* === PANTALLA: JUEGO === */
        #game-screen {
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        #game-screen section { z-index: 10; width: 100%; }

        .question {
            font-size: 1.8rem;
            margin: 0 auto 30px auto;
            max-width: 800px;
            min-height: 60px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); 
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0;
        }

        .option-btn {
            background-color: rgba(0, 0, 0, 0.7); 
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 100px; 
            padding: 15px 30px; 
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            width: 100%;
            text-shadow: 1px 1px 2px #000;
        }

        .option-btn:hover:not(:disabled) { background-color: rgba(255, 255, 255, 0.2); }
        .option-btn:active:not(:disabled) { transform: scale(0.98); }

        .action-btn {
            background-color: #ffffff;
            color: #000000;
            border: 3px solid #000000;
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 1.2rem;

        .action-btn:hover:not(:disabled) { background-color: #cccccc; }

        /* Estilo para botón deshabilitado */
        .action-btn:disabled {
            background-color: #444444 !important;
            color: #888888 !important;
            border-color: #222222 !important;
            cursor: not-allowed !important;

        }

        .btn-inverted {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;

        }

        .btn-inverted:hover { background-color: #333333; }

        /* === PIE DE PÁGINA (FOOTER) === */
        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 100;
            background-color: #000000;
        }

        .author-info { color: rgba(150, 150, 150, 0.5); font-size: 0.85rem; margin: 0; }

        .ad-block {
            position: absolute;
            bottom: 20px; 
            left: 50%;
            transform: translateX(-50%); 
            width: 320px;
            height: 40px;
            background-color: rgba(10, 10, 10, 0.9);
            border: 1px solid #1a1a1a;
            color: #666666;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            pointer-events: auto;
        }

        .status-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            transition: opacity 0.3s;
            text-shadow: 2px 2px 4px #000;
        }

        .level-title { font-size: 0.9rem; color: #cccccc; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; }
        .counter { font-size: 2rem; font-weight: bold; color: #ffffff; }

        /* === RESPONSIVE (CELULARES) === */
        @media (max-width: 768px) {
            header { padding: 15px; }
            .timer-display { font-size: 1.2rem; }
            
            .carousel-btn { font-size: 2.5rem; padding: 0 15px; }
            .team-center { font-size: 1.8rem; }
            .team-side { font-size: 1rem; }
            .left-side { left: 0px; }
            .right-side { right: 0px; }
            
            .vitrina-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .screen-title { font-size: 1.8rem; margin-bottom: 25px; }
            
            #vitrina-screen, #leaderboard-screen { padding: 80px 20px 130px 20px; }
            
            .leaderboard-table th, .leaderboard-table td { padding: 10px 5px; font-size: 0.9rem; }
            
            .question { font-size: 1.3rem; margin-bottom: 20px; }
            .option-btn { font-size: 1rem; padding: 12px 20px; }
            .action-btn { font-size: 1rem; padding: 12px 20px; }
            
            footer { padding: 0 15px; height: 60px; }
            .ad-block { width: 150px; font-size: 0.6rem; bottom: 10px; }
            .author-info { font-size: 0.7rem; }
            .counter { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle-btn" onclick="toggleSidebar()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <div class="header-logo" id="header-logo">
            <img src="Gemini_Generated_Image_4u8ifx4u8ifx4u8i-removebg-preview.png" alt="Trivia del Socio">
        </div>
        <div class="timer-display" id="main-timer">00:00</div>
    </header>

    <aside class="sidebar" id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        <nav class="sidebar-nav">
            <button id="nav-inicio" class="active-nav" onclick="switchScreen('menu-screen', this); toggleSidebar();">Inicio</button>
            <button id="nav-vitrina" onclick="switchScreen('vitrina-screen', this); toggleSidebar();">Vitrina</button>
            <button id="nav-posiciones" onclick="switchScreen('leaderboard-screen', this); toggleSidebar(); loadLeaderboardFromFirebase();">Posiciones</button>
        </nav>
        <div class="sidebar-footer-nav">
            <button disabled>Acerca de...<span class="soon-tag">Próximamente</span></button>
            <button disabled>Configuración<span class="soon-tag">Próximamente</span></button>
        </div>
    </aside>

    <div id="login-screen" class="screen active">
        <div class="login-logo">
            <img src="Gemini_Generated_Image_4u8ifx4u8ifx4u8i-removebg-preview.png" alt="Trivia del Socio Logo">
        </div>
        <div class="login-box">
            <h2>Identifíquese, socio.</h2>
            <input type="text" id="username-input" class="login-input" placeholder="Tu nombre de usuario" maxlength="15">
            <button class="action-btn" style="display: block; position: relative;" onclick="handleLogin()">Ingresar</button>
        </div>
    </div>

    <main id="menu-screen" class="screen">
        <div id="user-greeting" class="user-greeting">¿Qué club te gusta, socio?</div>
        <div class="carousel-wrapper">
            <button class="carousel-btn" onclick="prevClub()">&#10094;</button>
            <div class="carousel-track">
                <div class="team-side left-side" id="prev-team">Huracán</div>
                <div class="team-center pop-anim" id="team-name">River Plate</div>
                <div class="team-side right-side" id="next-team">Boca Juniors</div>
            </div>
            <button class="carousel-btn" onclick="nextClub()">&#10095;</button>
        </div>
        <button id="play-btn" class="action-btn" style="display: block; position: relative; z-index: 10;" onclick="startGame()">¡Quiero ser socio!</button>
    </main>

    <main id="vitrina-screen" class="screen">
        <h1 class="screen-title vitrina-title">⭐ Tu Vitrina de Socios ⭐</h1>
        <div class="vitrina-grid" id="vitrina-grid"></div>
    </main>

    <main id="leaderboard-screen" class="screen">
        <h1 class="screen-title">Tabla de Posiciones</h1>
        <div class="leaderboard-container">
            <div class="podium-box" id="podium-container"></div>
            <table class="leaderboard-table" id="leaderboard-table-wrap">
                <thead>
                    <tr>
                        <th>N°</th>
                        <th>Nombre</th>
                        <th>Club</th>
                        <th>Tiempo</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </main>

    <main id="game-screen" class="screen">
        <section aria-labelledby="question-text">
            <p class="question" id="question-text">Cargando pregunta...</p>
            
            <div class="options-list" id="options-container">
                <button class="option-btn" onclick="checkAnswer(0)" id="btn-0">Opción 1</button>
                <button class="option-btn" onclick="checkAnswer(1)" id="btn-1">Opción 2</button>
                <button class="option-btn" onclick="checkAnswer(2)" id="btn-2">Opción 3</button>
                <button class="option-btn" onclick="checkAnswer(3)" id="btn-3">Opción 4</button>
            </div>

            <button id="final-action-btn" class="action-btn"></button>
            <button id="fe-hincha-btn" class="action-btn" style="background-color: #ffd700; color: #000; border-color: #ccaa00;" onclick="restartFromCurrentLevel()">La fe del hincha...</button>
            <button id="back-menu-btn" class="action-btn btn-inverted" onclick="switchScreen('menu-screen', document.getElementById('nav-inicio'))">Volver al menú</button>
        </section>
    </main>

    <footer>
        <p class="author-info">Creado por: Yair Carrizo</p>
        <div class="ad-block">Espacio Publicitario</div>
        <div class="status-container" id="status-container" style="opacity: 0;">
            <span class="level-title" id="level-title">Nivel: Fácil</span>
            <div class="counter" id="counter-text">0/5</div>
        </div>
    </footer>

    <script>
        let currentPlayer = localStorage.getItem('vf_player') || "Socio Anónimo";
        
        // SE AÑADIERON LANÚS Y BANFIELD A LA LISTA
        const clubs = ["River Plate", "Boca Juniors", "Independiente", "Racing", "San Lorenzo", "Huracán", "Lanús", "Banfield", "Estudiantes (LP)", "Gimnasia (LP)", "Rosario Central", "Newell's Old Boys", "Colón", "Argentinos Juniors"];
        let currentClubIndex = 0;
        
        // SE AÑADIERON LANÚS Y BANFIELD AL ESTADO GUARDADO DE LA VITRINA
        let unlockedClubs = JSON.parse(localStorage.getItem('vf_unlocked')) || {
            "River Plate": false, "Boca Juniors": false, "Independiente": false,
            "Racing": false, "San Lorenzo": false, "Huracán": false,
            "Lanús": false, "Banfield": false, "Estudiantes (LP)": false, "Gimnasia (LP)": false,
            "Rosario Central": false, "Newell's Old Boys": false, "Colón": false, "Argentinos Juniors": false
        };

        let leaderboardData = [];
        let gameTimer = 0;
        let timerInterval;
        let feHinchaUsed = false;

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('vf_player')) {
                document.getElementById('username-input').value = currentPlayer;
                document.getElementById('user-greeting').innerText = `¿Qué club te gusta, ${currentPlayer}?`;
            }
        });

        function handleLogin() {
            const inputVal = document.getElementById('username-input').value.trim();
            if(inputVal !== "") {
                currentPlayer = inputVal;
                localStorage.setItem('vf_player', currentPlayer);
            }
            document.getElementById('user-greeting').innerText = `¿Qué club te gusta, ${currentPlayer}?`;
            switchScreen('menu-screen', document.getElementById('nav-inicio'));
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function renderVitrina() {
            const grid = document.getElementById('vitrina-grid');
            grid.innerHTML = '';
            clubs.forEach(club => {
                const isUnlocked = unlockedClubs[club] || false;
                grid.innerHTML += `
                    <div class="card-wrapper">
                        <div class="socio-card ${isUnlocked ? 'unlocked' : ''}">
                            <div class="card-photo"></div>
                            <div class="card-lines">
                                <div class="card-line"></div>
                                <div class="card-line"></div>
                                <div class="card-line short"></div>
                            </div>
                        </div>
                        <p class="card-desc">Socio de ${club}</p>
                    </div>
                `;
            });
        }
        renderVitrina();

        function renderLeaderboard() {
            const podiumBox = document.getElementById('podium-container');
            const tbody = document.getElementById('leaderboard-body');
            const tableWrap = document.getElementById('leaderboard-table-wrap');
            
            podiumBox.innerHTML = '';
            tbody.innerHTML = '';

            const sortedData = [...leaderboardData].sort((a, b) => a.time - b.time);

            const top3 = sortedData.slice(0, 3);
            const medals = ["🥇 1° Puesto", "🥈 2° Puesto", "🥉 3° Puesto"];
            const podiumClasses = ["p1", "p2", "p3"];

            top3.forEach((entry, idx) => {
                podiumBox.innerHTML += `
                    <div class="podium-card ${podiumClasses[idx]}">
                        <div class="podium-place">${medals[idx]}</div>
                        <div class="podium-name">${entry.name}</div>
                        <div class="podium-details">${entry.club}</div>
                        <div class="podium-details" style="font-weight:bold; margin-top:4px;">${formatTime(entry.time)}</div>
                    </div>
                `;
            });

            const restOfPlayers = sortedData.slice(3);
            if (restOfPlayers.length > 0) {
                tableWrap.style.display = 'table';
                restOfPlayers.forEach((entry, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 4}</td>
                            <td>${entry.name}</td>
                            <td>${entry.club}</td>
                            <td>${formatTime(entry.time)}</td>
                        </tr>
                    `;
                });
            } else {
                tableWrap.style.display = 'none';
            }
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        function switchScreen(screenId, btnElement) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if(btnElement) {
                document.querySelectorAll('.sidebar-nav button').forEach(b => b.classList.remove('active-nav'));
                btnElement.classList.add('active-nav');
            }

            document.getElementById('status-container').style.opacity = (screenId === 'game-screen') ? '1' : '0';
            document.getElementById('main-timer').style.display = (screenId === 'game-screen') ? 'block' : 'none';
            
            // Lógica para mostrar/ocultar el logo del encabezado
            const headerLogo = document.getElementById('header-logo');
            if (headerLogo) {
                if (screenId === 'login-screen' || screenId === 'game-screen') {
                    headerLogo.style.display = 'none';
                } else {
                    headerLogo.style.display = 'flex';
                }
            }

            if(screenId !== 'game-screen') clearInterval(timerInterval);
        }

        function updateCarousel() {
            const prevIndex = (currentClubIndex - 1 + clubs.length) % clubs.length;
            const nextIndex = (currentClubIndex + 1) % clubs.length;
            document.getElementById('prev-team').innerText = clubs[prevIndex];
            document.getElementById('next-team').innerText = clubs[nextIndex];
            
            const centerTeam = document.getElementById('team-name');
            centerTeam.innerText = clubs[currentClubIndex];
            
            centerTeam.classList.remove('pop-anim');
            void centerTeam.offsetWidth; 
            centerTeam.classList.add('pop-anim');

            // SISTEMA DE BLOQUEO PARA LANÚS Y BANFIELD
            const playBtn = document.getElementById('play-btn');
            const currentSelectedClub = clubs[currentClubIndex];
            
            if (currentSelectedClub === "Lanús" || currentSelectedClub === "Banfield" || currentSelectedClub === "Estudiantes (LP)" || currentSelectedClub === "Gimnasia (LP)" || currentSelectedClub === "Rosario Central" || currentSelectedClub === "Newell's Old Boys" || currentSelectedClub === "Colón" || currentSelectedClub === "Argentinos Juniors") {
                playBtn.disabled = true;
                playBtn.innerText = "Próximamente";
            } else {
                playBtn.disabled = false;
                playBtn.innerText = "¡Quiero ser socio!";
            }
        }

        function nextClub() { currentClubIndex = (currentClubIndex + 1) % clubs.length; updateCarousel(); }
        function prevClub() { currentClubIndex = (currentClubIndex - 1 + clubs.length) % clubs.length; updateCarousel(); }

        const chicanas = {
            "River Plate": [
                { q: "Pregunta chicana:\n¿En qué año ocurrió el suceso por el cual las hinchadas rivales cantan sobre 'el fantasma de la B'?", options: ["2008", "2011", "2013", "1983"], answer: 1 },

                    { q: "¿En qué fecha exacta se jugó la ida de la final de la Libertadores 2014 en Asunción?", options: ["6 de agosto de 2014", "13 de agosto de 2014", "30 de julio de 2014", "20 de agosto de 2014"], answer: 0 },
                    { q: "¿En qué fecha exacta se jugó la vuelta de la final de la Libertadores 2014 en Buenos Aires?", options: ["13 de agosto de 2014", "6 de agosto de 2014", "20 de agosto de 2014", "27 de agosto de 2014"], answer: 0 },

                    { q: "¿En qué cancha se jugó ese partido en el que Scotta llegó a los 60 goles, un 28 de diciembre de 1975?", options: ["Cancha de Huracán", "El Gasómetro", "Cancha de Ferro", "El Cilindro"], answer: 0 },
                    { q: "¿Cuántos goles había hecho Arsenio Erico en 1937, el récord que superó Scotta?", options: ["47", "40", "52", "35"], answer: 0 },
                    { q: "¿Cuántos goles marcó Rodrigo Astudillo en la Copa Sudamericana 2002, siendo uno de los máximos goleadores del torneo?", options: ["4", "3", "5", "2"], answer: 0 },
                    { q: "¿Aproximadamente cuántos espectadores presenciaron la vuelta de la final de la Sudamericana 2002 en el Nuevo Gasómetro?", options: ["Cerca de 40.000", "Cerca de 20.000", "Cerca de 60.000", "Cerca de 15.000"], answer: 0 },
                    { q: "¿En qué fecha se jugó la ida de la final de la Copa Mercosur 2001 en el Maracaná?", options: ["12 de diciembre de 2001", "24 de enero de 2002", "5 de diciembre de 2001", "19 de diciembre de 2001"], answer: 0 },
                    { q: "¿Por qué tuvo que postergarse la vuelta de la final de la Copa Mercosur 2001, originalmente prevista para el 19 de diciembre?", options: ["Por disturbios sociales en Argentina", "Por una lesión masiva", "Por el estadio en obras", "Por el calendario de la Selección"], answer: 0 }
                ]
            },
            "Huracán": {
                facil: [ 
                    { q: "¿Cuál es el apodo principal del club?", options: ["El Ciclón", "El Globo / Quemeros", "El Fortín", "Los Bichos"], answer: 1 }, 
                    { q: "¿Cómo se llama el estadio de Huracán?", options: ["José Amalfitani", "Nuevo Gasómetro", "Tomás Adolfo Ducó", "Diego A. Maradona"], answer: 2 }, 
                    { q: "¿Cuáles son sus colores tradicionales?", options: ["Rojo y Blanco", "Blanco y Granate", "Blanco y Rojo", "Blanco con vivo Rojo"], answer: 2 }, 
                    { q: "¿Cuál es su clásico rival?", options: ["San Lorenzo", "Vélez Sarsfield", "Boca Juniors", "Argentinos Juniors"], answer: 0 }, 
                    { q: "¿A qué histórico barrio porteño pertenece?", options: ["Boedo", "Parque Patricios", "La Paternal", "Mataderos"], answer: 1 },
                    { q: "¿Qué elemento es el símbolo principal del escudo del club?", options: ["Un águila", "Un globo aerostático", "Una estrella", "Un faro"], answer: 1 },
                    { q: "¿Qué apodo recibe popularmente su estadio?", options: ["La Quema", "El Palacio", "El Cilindro", "La Catedral"], answer: 1 }
                ],
                medio: [ 
                    { q: "¿En qué año Huracán salió Campeón del emblemático Torneo Metropolitano?", options: ["1967", "1973", "1978", "1981"], answer: 1 }, 
                    { q: "¿Quién fue el DT de ese histórico equipo campeón en 1973?", options: ["César Luis Menotti", "Ángel Cappa", "Carlos Babington", "Alfio Basile"], answer: 0 }, 
                    { q: "¿Qué copa nacional conquistó en el año 2014?", options: ["Copa Argentina", "Copa de la Liga", "Supercopa Argentina", "Copa Centenario"], answer: 0 }, 
                    { q: "¿Qué jugador histórico es considerado el mayor ídolo y símbolo del club apodado 'El Loco'?", options: ["Herminio Masantonio", "René Houseman", "Miguel Brindisi", "Javier Pastore"], answer: 1 }, 
                    { q: "¿Quién fue el arquero figura del Huracán campeón de 1973?", options: ["Héctor Roganti", "Nery Pumpido", "Ubaldo Fillol", "Carlos Gatti"], answer: 0 },
                    { q: "¿Qué recordado DT lideró el equipo del 'Tiki Tiki' en el Clausura 2009?", options: ["César Menotti", "Antonio Mohamed", "Ángel Cappa", "Gustavo Alfaro"], answer: 2 },
                    { q: "¿A quién le ganó la final de la Supercopa Argentina jugada en 2015?", options: ["Boca Juniors", "River Plate", "Rosario Central", "San Lorenzo"], answer: 1 }
                ],
                dificil: [ 
                    { q: "¿Quién es el máximo goleador histórico de Huracán?", options: ["Emilio Baldonedo", "René Houseman", "Herminio Masantonio", "Tomás Ducó"], answer: 2 }, 
                    { q: "¿A qué equipo venció en la final de la Copa Argentina 2014 por penales?", options: ["River Plate", "Boca Juniors", "Rosario Central", "San Lorenzo"], answer: 2 }, 
                    { q: "¿A qué instancia internacional máxima llegó en la Copa Sudamericana 2015?", options: ["Semifinales", "Final", "Cuartos de final", "Campeón"], answer: 1 }, 
                    { q: "¿Qué jugador histórico tiene el récord de mayor cantidad de presencias en el club?", options: ["Jorge Alberti", "Miguel Brindisi", "Carlos Babington", "Roque Avallay"], answer: 0 }, 
                    { q: "¿En qué año descendió por última vez a la B Nacional antes de retornar en 2014?", options: ["2003", "2007", "2011", "2013"], answer: 2 },
                    { q: "¿Quién fue el arquero ataja penales clave en la consagración de la Copa Argentina 2014?", options: ["Marcos Díaz", "Gastón Monzón", "Hugo Barrientos", "Marcelo Barovero"], answer: 0 },
                    { q: "¿Qué histórico jugador de Huracán fue apodado 'El Inglés'?", options: ["Miguel Brindisi", "Carlos Babington", "Roque Avallay", "René Houseman"], answer: 1 }
                ],
                socio: [ 
                    { q: "¿En qué año se fundó oficialmente el Club Atlético Huracán?", options: ["1 de enero de 1908", "1 de noviembre de 1908", "25 de mayo de 1905", "12 de octubre de 1908"], answer: 1 }, 
                    { q: "¿De quién tomó su nombre el club 'Huracán'?", options: ["Un viento fuerte de la zona", "El globo aerostático de Jorge Newbery", "Un barco", "Una tienda de Parque Patricios"], answer: 1 }, 
                    { q: "¿Qué cargo ocupó el histórico Tomás Adolfo Ducó además de jugador y presidente?", options: ["Sacerdote", "Militar (Teniente Coronel)", "Gobernador", "Médico"], answer: 1 }, 
                    { q: "¿Cuántos títulos de Primera División en la era Amateur posee Huracán?", options: ["2", "3", "4", "5"], answer: 2 }, 
                    { q: "¿Cuál fue el primer presidente de la historia del club?", options: ["José Wuille Bille", "Tomás Ducó", "Jorge Newbery", "Lorenzo Mazzucco"], answer: 0 },
                    { q: "¿Qué lema figuraba en el acta original de fundación del club?", options: ["El barrio es grande", "Huracán al cielo", "El sexto grande", "Gloria y Honor"], answer: 1 },
                    { q: "¿En qué año se inauguró formalmente el actual Palacio Tomás Adolfo Ducó?", options: ["1947", "1949", "1951", "1955"], answer: 1 }
                ]
            }
        };

        const levels = ["facil", "medio", "dificil", "socio"];
        let currentLevelIndex = 0;
        let correctAnswers = 0;
        const requiredToAdvance = 5;
        let availableQuestions = {};
        let currentQuestionObj = null;
        let currentOptionsMap = [];
        let isChicana = false; 
        let chicanaAprobada = false;
        let chicanaResult = null; // null | "correcta" | "fallada" — base para el futuro sistema de puntos/trofeo

        function setClubBackground(club) {
            const gameScreen = document.getElementById('game-screen');
            gameScreen.className = 'screen active'; 
            
            if (club === "River Plate") gameScreen.classList.add('bg-river');
            else if (club === "Boca Juniors") gameScreen.classList.add('bg-boca');
            else if (club === "Independiente") gameScreen.classList.add('bg-independiente');
            else if (club === "Racing") gameScreen.classList.add('bg-racing');
            else if (club === "San Lorenzo") gameScreen.classList.add('bg-sanlorenzo');
            else if (club === "Huracán") gameScreen.classList.add('bg-huracan');
            else if (club === "Lanús") gameScreen.classList.add('bg-lanus');
            else if (club === "Banfield") gameScreen.classList.add('bg-banfield');
            else if (club === "Estudiantes (LP)") gameScreen.classList.add('bg-estudiantes');
            else if (club === "Gimnasia (LP)") gameScreen.classList.add('bg-gimnasia');
            else if (club === "Rosario Central") gameScreen.classList.add('bg-rosario');
            else if (club === "Newell's Old Boys") gameScreen.classList.add('bg-newells');
            else if (club === "Colón") gameScreen.classList.add('bg-colon');
            else if (club === "Argentinos Juniors") gameScreen.classList.add('bg-argentinos');
        }

        function startGame() {
            const selectedClub = clubs[currentClubIndex];
            const clubQuestions = database[selectedClub];

            availableQuestions = {
                facil: [...clubQuestions.facil],
                medio: [...clubQuestions.medio],
                dificil: [...clubQuestions.dificil],
                socio: [...clubQuestions.socio],
                chicana: [...chicanas[selectedClub]] 
            };

            currentLevelIndex = 0;
            correctAnswers = 0;
            isChicana = false;
            chicanaAprobada = false;
            chicanaResult = null;
            feHinchaUsed = false; 
            
            document.getElementById('final-action-btn').style.display = 'none';
            document.getElementById('fe-hincha-btn').style.display = 'none';
            document.getElementById('back-menu-btn').style.display = 'none';
            document.getElementById('options-container').style.display = 'flex';
            
            gameTimer = 0;
            clearInterval(timerInterval);
            document.getElementById('main-timer').innerText = "00:00";
            timerInterval = setInterval(() => {
                gameTimer++;
                document.getElementById('main-timer').innerText = formatTime(gameTimer);
            }, 1000);

            switchScreen('game-screen', document.getElementById('nav-inicio'));
            setClubBackground(selectedClub);
            loadNextQuestion();
        }

        function restartFromCurrentLevel() {
            feHinchaUsed = true; 
            const selectedClub = clubs[currentClubIndex];
            const currentDifficulty = levels[currentLevelIndex];
            
            availableQuestions[currentDifficulty] = [...database[selectedClub][currentDifficulty]];
            
            correctAnswers = 0;
            chicanaAprobada = false; 
            
            document.getElementById('final-action-btn').style.display = 'none';
            document.getElementById('fe-hincha-btn').style.display = 'none';
            document.getElementById('back-menu-btn').style.display = 'none';
            document.getElementById('options-container').style.display = 'flex';
            document.getElementById('status-container').style.opacity = '1';
            
            timerInterval = setInterval(() => {
                gameTimer++;
                document.getElementById('main-timer').innerText = formatTime(gameTimer);
            }, 1000);
            
            loadNextQuestion();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadNextQuestion() {
            const currentDifficulty = levels[currentLevelIndex];
            const selectedClub = clubs[currentClubIndex];
            const gameScreen = document.getElementById('game-screen');
            
            if (currentDifficulty === 'socio' && !chicanaAprobada) {
                isChicana = true;
                const pool = availableQuestions.chicana;
                const randomIndex = Math.floor(Math.random() * pool.length);
                currentQuestionObj = pool[randomIndex];
                pool.splice(randomIndex, 1);
                
                gameScreen.classList.add('chicana-dark-mode');
                document.getElementById('level-title').innerText = "CHICANA";
                document.getElementById('level-title').style.color = "#ff00ff";
            } else {
                isChicana = false;
                gameScreen.classList.remove('chicana-dark-mode');
                document.getElementById('level-title').style.color = "#cccccc";
                
                const pool = availableQuestions[currentDifficulty];
                const randomIndex = Math.floor(Math.random() * pool.length);
                currentQuestionObj = pool[randomIndex];
                pool.splice(randomIndex, 1);
                
                document.getElementById('level-title').innerText = `Nivel: ${currentDifficulty.toUpperCase()}`;
            }

            document.getElementById('question-text').innerText = currentQuestionObj.q;
            document.getElementById('counter-text').innerText = `${correctAnswers}/${requiredToAdvance}`;

            currentOptionsMap = currentQuestionObj.options.map((opt, originalIndex) => ({
                text: opt,
                isCorrect: originalIndex === currentQuestionObj.answer
            }));
            
            shuffleArray(currentOptionsMap);

            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`btn-${i}`);
                btn.innerText = currentOptionsMap[i].text;
                
                if (selectedClub === "Huracán" && !isChicana) {
                    btn.style.backgroundColor = "rgba(0,0,0,0.85)";
                } else {
                    btn.style.backgroundColor = "rgba(0,0,0,0.7)";
                }
                
                btn.style.borderColor = "#ffffff";
                btn.disabled = false;
            }
        }

        function checkAnswer(selectedIndex) {
            for (let i = 0; i < 4; i++) { document.getElementById(`btn-${i}`).disabled = true; }

            const btn = document.getElementById(`btn-${selectedIndex}`);
            const isCorrect = currentOptionsMap[selectedIndex].isCorrect;
            
            if (isCorrect) {
                btn.style.backgroundColor = "rgba(0, 128, 0, 0.9)"; 
                btn.style.borderColor = "#00ff00";

                if (isChicana) {
                    chicanaAprobada = true;
                    chicanaResult = "correcta";
                    setTimeout(loadNextQuestion, 1200);
                    return;
                }

                correctAnswers++;
                document.getElementById('counter-text').innerText = `${correctAnswers}/${requiredToAdvance}`;

                if (correctAnswers >= requiredToAdvance) {
                    correctAnswers = 0;
                    currentLevelIndex++;
                    
                    setTimeout(() => {
                        if (currentLevelIndex < levels.length) {
                            const nextLevel = levels[currentLevelIndex];
                            const qText = document.getElementById('question-text');
                            
                            if (nextLevel === "medio") qText.innerHTML = '<span style="color: #90ee90;">Siguiente nivel: Medio</span>';
                            else if (nextLevel === "dificil") qText.innerHTML = '<span style="color: #ffa500;">Siguiente nivel: Difícil</span>';
                            else if (nextLevel === "socio") qText.innerHTML = '<span style="color: #ff0000;">Siguiente nivel: Socio (Chicana Inminente)</span>';
                            
                            document.getElementById('options-container').style.display = 'none';
                            
                            setTimeout(() => {
                                document.getElementById('options-container').style.display = 'flex';
                                loadNextQuestion();
                            }, 2000); 

                        } else {
                            showWinScreen();
                        }
                    }, 500);
                } else {
                    setTimeout(loadNextQuestion, 800);
                }
            } else {
                btn.style.backgroundColor = "rgba(204, 0, 0, 0.9)"; 
                btn.style.borderColor = "#ff0000";
                
                const correctIndex = currentOptionsMap.findIndex(opt => opt.isCorrect);
                const correctBtn = document.getElementById(`btn-${correctIndex}`);
                correctBtn.style.backgroundColor = "rgba(0, 128, 0, 0.9)";

                if (isChicana) {
                    chicanaAprobada = true;
                    chicanaResult = "fallada";
                    setTimeout(loadNextQuestion, 1500);
                    return;
                }

                setTimeout(showLoseScreen, 1500);
            }
        }

        function showLoseScreen() {
            clearInterval(timerInterval);
            const clubName = clubs[currentClubIndex];
            document.getElementById('game-screen').classList.remove('chicana-dark-mode');
            
            if (feHinchaUsed) {
                document.getElementById('question-text').innerText = `Decepcionaste a los hinchas que confiaban en vos, ${currentPlayer}.`;
            } else {
                document.getElementById('question-text').innerText = `Usted no es un verdadero fanático de ${clubName}...`;
            }

            document.getElementById('options-container').style.display = 'none';
            document.getElementById('status-container').style.opacity = '0'; 
            
            const actionBtn = document.getElementById('final-action-btn');
            actionBtn.innerText = "Volver a jugar";
            actionBtn.onclick = startGame;
            actionBtn.style.display = 'block';

            const feBtn = document.getElementById('fe-hincha-btn');
            if (currentLevelIndex >= 2 && !feHinchaUsed) { 
                feBtn.style.display = 'block';
            } else {
                feBtn.style.display = 'none';
            }

            document.getElementById('back-menu-btn').style.display = 'block';
        }

        function showWinScreen() {
            clearInterval(timerInterval);
            const clubName = clubs[currentClubIndex];
            document.getElementById('game-screen').classList.remove('chicana-dark-mode');
            document.getElementById('question-text').innerText = `¡Usted es un socio de ${clubName} con todas las letras!\nTiempo: ${formatTime(gameTimer)}`;
            document.getElementById('options-container').style.display = 'none';
            document.getElementById('status-container').style.opacity = '0'; 
            
            if (typeof window.fbSaveScore === 'function') {
                window.fbSaveScore(currentPlayer, clubName, gameTimer);
            }

            const actionBtn = document.getElementById('final-action-btn');
            actionBtn.innerText = "Obtener reconocimiento";
            actionBtn.onclick = triggerCardAnimation; 
            actionBtn.style.display = 'block';
            
            document.getElementById('fe-hincha-btn').style.display = 'none';
            document.getElementById('back-menu-btn').style.display = 'block';
        }

        function triggerCardAnimation() {
            document.getElementById('final-action-btn').style.display = 'none';
            document.getElementById('back-menu-btn').style.display = 'none';
            document.getElementById('question-text').innerText = "Generando credencial...";

            const flyingCard = document.createElement('div');
            flyingCard.className = 'flying-card';
            
            flyingCard.innerHTML = `
                <div style="display:flex; gap:10px; padding:10px; height:100%; box-sizing:border-box;">
                    <div style="width:30px; background:#fff; border-radius:4px;"></div>
                    <div style="display:flex; flex-direction:column; gap:6px; flex-grow:1;">
                        <div style="height:4px; background:#fff;"></div>
                        <div style="height:4px; background:#fff;"></div>
                        <div style="height:4px; background:#fff; width:60%;"></div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(flyingCard);
            flyingCard.style.top = '50%';
            flyingCard.style.left = '50%';
            flyingCard.style.transform = 'translate(-50%, -50%)';
            flyingCard.style.position = 'absolute';
            flyingCard.style.width = '150px';
            flyingCard.style.height = '90px';
            flyingCard.style.border = '3px solid #fff';
            flyingCard.style.borderRadius = '8px';
            flyingCard.style.background = 'rgba(255,255,255,0.15)';
            flyingCard.style.transition = 'all 1.2s ease-in-out';
            flyingCard.style.zIndex = '500';

            void flyingCard.offsetWidth;

            const menuIcon = document.getElementById('menu-toggle-btn').getBoundingClientRect();
            
            setTimeout(() => {
                flyingCard.style.top = `${menuIcon.top}px`;
                flyingCard.style.left = `${menuIcon.left}px`;
                flyingCard.style.transform = 'translate(0, 0) scale(0.1)';
                flyingCard.style.opacity = '0';
            }, 100);

            setTimeout(() => {
                flyingCard.remove();
                unlockedClubs[clubs[currentClubIndex]] = true; 
                localStorage.setItem('vf_unlocked', JSON.stringify(unlockedClubs));
                renderVitrina(); 
                switchScreen('vitrina-screen', document.getElementById('nav-vitrina')); 
            }, 1300); 
        }
    </script>
